<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Animated Movie Features — Scene Examples</title>
  <style>
    :root { font-family: Arial, Helvetica, sans-serif; color: #222; background: #fff; }
    * { box-sizing: border-box; }
    body { max-width: 1800px; margin: 0 auto; padding: 36px 24px 70px; }
    h1 { font-size: 26px; font-weight: 600; margin: 0 0 12px; }
    .intro { color: #555; line-height: 1.5; margin: 0 0 35px; }
    .categories { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 38px; }
    .category { background: white; border: 1px solid #ccc; border-left: 7px solid var(--feature-color); padding: 12px 16px; font: inherit; cursor: pointer; text-align: left; }
    .category:hover, .category[aria-pressed="true"] { background: #f3f3f3; border-color: #777; border-left-color: var(--feature-color); }
    h2 { font-size: 21px; font-weight: 600; margin: 0 0 22px; padding-left: 13px; border-left: 7px solid var(--feature-color); }
    .clips { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 44px; align-items: start; }
    h3 { font-size: 19px; font-weight: 600; margin: 0 0 16px; padding-bottom: 9px; border-bottom: 1px solid #dedede; letter-spacing: 0; }
    video { display: block; width: 100%; max-width: none; height: auto; aspect-ratio: 16/9; background: #eee; }
    section video:not(:first-of-type) { margin-top: 28px; }
    .clips section { min-width: 0; }
    .clips section + section { padding-left: 28px; border-left: 1px solid #e3e3e3; }
    .note { color: #666; font-size: 13px; line-height: 1.5; }
    footer { margin-top: 55px; padding-top: 20px; border-top: 1px solid #ddd; color: #777; font-size: 13px; }
    @media (max-width: 750px) { body { padding: 26px 16px; } .clips { grid-template-columns: 1fr; gap: 44px; } .clips section + section { padding-left: 0; padding-top: 32px; border-left: 0; border-top: 1px solid #e3e3e3; } }
  </style>
</head>
<body>
  <h1>Animated Movie Features</h1>
  <p class="intro">Representative animated movie scenes illustrating different values of annotated features.</p>
  <nav class="categories" id="categories" aria-label="Feature categories"></nav>
  <main id="feature-content" aria-live="polite"></main>
  <footer>Supplementary material accompanying the research paper.</footer>
  <script>
    // Each group uses its base filename and optional -2, -3, ... variants.
    // Only files that exist in videos/ will be displayed on GitHub Pages.
    const features = [
      { name: 'Theory of Mind', color: '#008000', groups: [
        { label: 'ToM Present', fileBase: 'theory-of-mind-high' },
        { label: 'ToM Absent', fileBase: 'theory-of-mind-low' }
      ] },
      { name: 'Social Interaction', color: '#403878', groups: [
        { label: 'Interaction Present', fileBase: 'social-interaction-high' },
        { label: 'Interaction Absent', fileBase: 'social-interaction-low' }
      ] },
      { name: 'Number of People', color: '#80A4C3', groups: [
        { label: '3 or More Agents', fileBase: 'number-of-people-high' },
        { label: 'One Agent', fileBase: 'number-of-people-low' }
      ] },
      { name: 'Faces', color: '#1D6080', groups: [
        { label: 'Faces Present', fileBase: 'faces-high' },
        { label: 'Faces Absent', fileBase: 'faces-low' }
      ] },
      { name: 'Valence', color: '#CC6948', groups: [
        { label: 'Positive Valence', fileBase: 'valence-high' },
        { label: 'Negative Valence', fileBase: 'valence-low' }
      ] },
      { name: 'Arousal', color: '#D5A6B0', groups: [
        { label: 'High Arousal', fileBase: 'arousal-high' },
        { label: 'Low Arousal', fileBase: 'arousal-low' }
      ] }
    ];
    const MAX_EXAMPLES = 30;
    async function findVideos(fileBase) {
      const files = [];
      // The first missing file ends the sequence. Keep numbering consecutive.
      for (let number = 1; number <= MAX_EXAMPLES; number++) {
        const filename = fileBase + (number === 1 ? '' : '-' + number) + '.mp4';
        try {
          const response = await fetch('videos/' + filename, { method: 'HEAD' });
          if (!response.ok) break;
          files.push(filename);
        } catch (error) {
          // Local file:// previews may not support fetch; use GitHub Pages.
          break;
        }
      }
      return files;
    }
    const nav = document.getElementById('categories');
    const main = document.getElementById('feature-content');
    features.forEach((feature, index) => {
      const button = document.createElement('button');
      button.className = 'category';
      button.textContent = feature.name;
      button.style.setProperty('--feature-color', feature.color);
      button.addEventListener('click', () => showFeature(index));
      nav.appendChild(button);
    });
    let currentSelection = 0;
    function showFeature(index) {
      currentSelection = index;
      const feature = features[index];
      [...nav.children].forEach((button, i) => button.setAttribute('aria-pressed', String(i === index)));
      main.replaceChildren();
      const heading = document.createElement('h2');
      heading.textContent = feature.name;
      heading.style.setProperty('--feature-color', feature.color);
      main.appendChild(heading);
      const clips = document.createElement('div');
      clips.className = 'clips';
      feature.groups.forEach(async group => {
        const section = document.createElement('section');
        const title = document.createElement('h3');
        title.textContent = group.label;
        section.appendChild(title);
        const status = document.createElement('p');
        status.className = 'note';
        status.textContent = 'Loading examples…';
        section.appendChild(status);
        clips.appendChild(section);
        const filenames = await findVideos(group.fileBase);
        if (currentSelection !== index) return;
        status.remove();
        if (filenames.length === 0) {
          const empty = document.createElement('p');
          empty.className = 'note';
          empty.textContent = 'Examples coming soon.';
          section.appendChild(empty);
        }
        filenames.forEach(file => {
          const video = document.createElement('video');
          video.controls = true;
          video.preload = 'metadata';
          video.setAttribute('playsinline', '');
          video.src = 'videos/' + file;
          section.appendChild(video);
        });
      });
      main.appendChild(clips);
    }
    showFeature(0);
  </script>
</body>
</html>
