<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Animated Movie Features — Scene Examples</title>
  <style>
    :root { font-family: Arial, Helvetica, sans-serif; color: #222; background: #fff; }
    * { box-sizing: border-box; }
    body { max-width: 980px; margin: 0 auto; padding: 55px 24px 80px; }
    h1 { font-size: 26px; font-weight: 600; margin: 0 0 12px; }
    .intro { color: #555; line-height: 1.5; margin: 0 0 35px; }
    .categories { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 38px; }
    .category { background: white; border: 1px solid #ccc; border-left: 7px solid var(--feature-color); padding: 12px 16px; font: inherit; cursor: pointer; text-align: left; }
    .category:hover, .category[aria-pressed="true"] { background: #f3f3f3; border-color: #777; border-left-color: var(--feature-color); }
    h2 { font-size: 21px; font-weight: 600; margin: 0 0 22px; padding-left: 13px; border-left: 7px solid var(--feature-color); }
    .clips { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 25px; }
    h3 { font-size: 16px; margin: 0 0 12px; }
    video { display: block; width: 100%; aspect-ratio: 16/9; background: #eee; }
    .note { color: #666; font-size: 13px; line-height: 1.5; }
    footer { margin-top: 55px; padding-top: 20px; border-top: 1px solid #ddd; color: #777; font-size: 13px; }
    @media (max-width: 650px) { body { padding: 30px 18px; } .clips { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>Animated Movie Features</h1>
  <p class="intro">Representative animated movie scenes illustrating high and low values of annotated features.</p>
  <nav class="categories" id="categories" aria-label="Feature categories"></nav>
  <main id="feature-content" aria-live="polite"></main>
  <footer>Supplementary material accompanying the research paper.</footer>
  <script>
    // To add a clip, put the MP4 file in the videos folder and update its filename below.
    const features = [
      { name: 'Theory of Mind', color: '#008000', high: 'theory-of-mind-high.mp4', low: 'theory-of-mind-low.mp4' },
      { name: 'Social Interaction', color: '#403878', high: 'social-interaction-high.mp4', low: 'social-interaction-low.mp4' },
      { name: 'Number of People', color: '#80A4C3', high: 'number-of-people-high.mp4', low: 'number-of-people-low.mp4' },
      { name: 'Faces', color: '#1D6080', high: 'faces-high.mp4', low: 'faces-low.mp4' },
      { name: 'Valence', color: '#CC6948', high: 'valence-high.mp4', low: 'valence-low.mp4' },
      { name: 'Arousal', color: '#D5A6B0', high: 'arousal-high.mp4', low: 'arousal-low.mp4' }
    ];
    const nav = document.getElementById('categories');
    const main = document.getElementById('feature-content');
    features.forEach((feature, index) => {
      const button = document.createElement('button');
      button.className = 'category';
      button.textContent = feature.name;
      button.style.setProperty('--feature-color', feature.color);
      button.addEventListener('click', () => showFeature(index));
      nav.appendChild(button);
    });
    function showFeature(index) {
      const feature = features[index];
      [...nav.children].forEach((button, i) => button.setAttribute('aria-pressed', String(i === index)));
      main.replaceChildren();
      const heading = document.createElement('h2');
      heading.textContent = feature.name;
      heading.style.setProperty('--feature-color', feature.color);
      main.appendChild(heading);
      const clips = document.createElement('div');
      clips.className = 'clips';
      [['High feature value', feature.high], ['Low feature value', feature.low]].forEach(([label, file]) => {
        const section = document.createElement('section');
        const title = document.createElement('h3');
        title.textContent = label;
        const video = document.createElement('video');
        video.controls = true;
        video.preload = 'metadata';
        video.setAttribute('playsinline', '');
        video.src = 'videos/' + file;
        const note = document.createElement('p');
        note.className = 'note';
        note.textContent = 'Scene example';
        section.append(title, video, note);
        clips.appendChild(section);
      });
      main.appendChild(clips);
    }
    showFeature(0);
  </script>
</body>
</html>
